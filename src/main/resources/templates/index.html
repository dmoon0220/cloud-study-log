<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AWS 실습 기록장</title>
</head>
<body>
<h1>AWS 실습 기록장</h1>
<p>AWS와 개발 공부 내용을 기록해 보세요.</p>

<h2>새 기록 작성</h2>

<form th:action="@{/notes}" th:object="${note}" method="post">
    <p>
        <label>제목</label><br>
        <input type="text" th:field="*{title}" required>
    </p>

    <p>
        <label>분류</label><br>
        <select th:field="*{category}" required>
            <option value="">분류 선택</option>
            <option value="AWS">AWS</option>
            <option value="DevOps">DevOps</option>
            <option value="Kubernetes">Kubernetes</option>
            <option value="기타">기타</option>
        </select>
    </p>

    <p>
        <label>공부 내용</label><br>
        <textarea th:field="*{content}" rows="5" cols="40" required></textarea>
    </p>

    <button type="submit">기록 저장</button>
</form>

<hr>

<h2>내 공부 기록</h2>

<p th:if="${#lists.isEmpty(notes)}">
    아직 저장된 기록이 없습니다.
</p>

<div th:each="item : ${notes}">
    <h3 th:text="${item.title}">기록 제목</h3>
    <p>분류: <span th:text="${item.category}"></span></p>
    <p th:text="${item.content}">공부 내용</p>
    <p>
        복습 상태:
        <span th:text="${item.reviewed ? '복습 완료' : '복습 필요'}"></span>
    </p>

    <form th:action="@{/notes/{id}/review(id=${item.id})}" method="post">
        <button type="submit"
                th:text="${item.reviewed ? '복습 완료 취소' : '복습 완료'}">
            복습 완료
        </button>
    </form>
    <form th:action="@{/notes/{id}/delete(id=${item.id})}"
          method="post"
          onsubmit="return confirm('이 기록을 삭제할까요?');">
        <button type="submit">삭제</button>
    </form>
    <hr>

</div>
</body>
</html>
